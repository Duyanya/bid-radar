name: 投标雷达 每日抓取

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00。GitHub 的 cron 是 UTC，且高峰期可能延迟 5–30 分钟。
    - cron: "0 1 * * *"
  workflow_dispatch:        # 支持在 Actions 页手动点一次

permissions:
  contents: write           # 需要把 data/ 和 site/ 提交回仓库

concurrency:
  group: bid-radar-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖（含 xvfb，联通必须带界面浏览器）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 抓取三家公告
        env:
          PYTHONIOENCODING: utf-8
        run: xvfb-run -a python collector.py all 15 20

      - name: 生成静态站点
        env:
          PYTHONIOENCODING: utf-8
        run: |
          echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" > data/public_url.txt
          python build_static.py

      - name: 统计结果
        run: |
          python - <<'PY'
          import json, pathlib
          s = json.loads(pathlib.Path("site/data/stats.json").read_text(encoding="utf-8"))
          print(f"总数 {s['total']}｜在架 {s['active']}｜已下架 {s['archived']}"
                f"｜移动 {s['cmcc']}｜联通 {s['cu']}｜电信 {s['ct']}")
          PY

      - name: 提交数据与页面
        run: |
          git config user.name  "bid-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data site
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "data: $(date -u +%F) 自动更新"
            git push
          fi
