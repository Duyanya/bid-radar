name: 投标雷达 每日抓取

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00。GitHub 的 cron 是 UTC，且高峰期可能延迟 5–30 分钟。
    - cron: "0 1 * * *"
  workflow_dispatch:        # 支持在 Actions 页手动点一次

permissions:
  contents: write           # 需要把 data/ 和 site/ 提交回仓库
  pages: write              # 抓完直接发布到 Pages，不然每日更新上不了线
  id-token: write

concurrency:
  group: bid-radar-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖（含 xvfb，联通必须带界面浏览器）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 抓取三家公告
        env:
          PYTHONIOENCODING: utf-8
        run: xvfb-run -a python collector.py all 15 20

      - name: 并回 WAL 并体检
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import db, sqlite3
          db.checkpoint()
          n = sqlite3.connect("data/bids.db").execute("SELECT COUNT(*) FROM bids").fetchone()[0]
          print(f"主库行数 {n}（checkpoint 后，提交的就是这个数）")
          assert n > 100, f"主库只有 {n} 行，疑似数据没并回，终止提交"
          PY
          ls -la data/bids.db; ls data/bids.db-wal 2>/dev/null || echo "WAL 已清空（正常）"

      - name: 生成静态站点
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # 公网地址：Cloudflare Pages 建好后，在仓库 Variables 里设 PUBLIC_URL 即可覆盖
          if [ -n "${{ vars.PUBLIC_URL }}" ]; then
            echo "${{ vars.PUBLIC_URL }}" > data/public_url.txt
          fi
          python build_static.py

      - name: 统计结果
        run: |
          python - <<'PY'
          import json, pathlib
          s = json.loads(pathlib.Path("site/data/stats.json").read_text(encoding="utf-8"))
          print(f"总数 {s['total']}｜在架 {s['active']}｜已下架 {s['archived']}"
                f"｜移动 {s['cmcc']}｜联通 {s['cu']}｜电信 {s['ct']}")
          PY

      - name: 提交数据与页面
        run: |
          git config user.name  "bid-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data site
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "data: $(date -u +%F) 自动更新"
            # 远端可能被手动/接口提交过，先 rebase 再推，最多重试 3 次
            ok=0
            for i in 1 2 3; do
              git pull --rebase --autostash -X theirs -q origin master || git rebase --abort || true
              if git push -q origin HEAD:master; then ok=1; break; fi
              sleep 5
            done
            test "$ok" = "1" || { echo "推送失败"; exit 1; }
          fi

      # 用 GITHUB_TOKEN 推送不会触发 pages.yml，所以这里直接发布一次
      - name: 发布静态站到 Pages
        uses: actions/configure-pages@v5

      - name: 上传静态站
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署 Pages
        uses: actions/deploy-pages@v4
